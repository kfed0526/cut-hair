<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fcf7ed">
  <title>Nickson 的小小理髮店</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='85'%3E✂%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="salon.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="shell">
    <header class="top"><span class="brand">✂ NICKSON'S LITTLE SALON</span><details id="parent-settings"><summary>⚙ 家長設定</summary><div class="settings-panel">
      <label for="speech-volume">語音音量 <output id="speech-value"></output></label><input id="speech-volume" data-setting="speechVolume" type="range" min="0" max="100" step="5">
      <label for="effects-volume">工具音效 <output id="effects-value"></output></label><input id="effects-volume" data-setting="effectsVolume" type="range" min="0" max="100" step="5">
      <label for="speech-speed">說話速度</label><select id="speech-speed" data-setting="speed"><option value="1">1 · 很慢</option><option value="2">2 · 慢</option><option value="3">3 · 標準</option><option value="4">4 · 稍快</option><option value="5">5 · 快</option></select>
      <label class="check-setting"><input type="checkbox" id="motion" data-setting="motion">人物與落髮動畫</label><p>只保存在這個遊戲；0 為靜音，不讀取 Panda School 的設定。</p><p id="storage-status" role="status"></p>
    </div></details></header>
    <main id="game" inert aria-label="Nickson 的小小理髮店"></main>
    <noscript><p>請啟用 JavaScript，才能玩剪髮遊戲。</p></noscript>
  </div>
  <section id="welcome" class="welcome" role="dialog" aria-modal="true" aria-labelledby="welcome-title"><div class="welcome-card"><span aria-hidden="true">✂</span><h1 id="welcome-title">Nickson 的小小理髮店</h1><p>剪一剪、梳一梳，幫自己換造型！</p><button id="start" class="primary" disabled autofocus>照片和聲音準備中…</button><p id="load-status" role="status">只剪遊戲裡的頭髮，真的剪刀請大人幫忙。</p><button id="retry-load" hidden>↻ 重新載入</button></div></section>
</body>
</html>
